name: universal interoperability policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interop-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  policy:
    name: Matrix, RFC, and immutable-boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Parse validator without writing bytecode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_interop_matrix.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Validate executable interoperability policy
        run: |
          set -euo pipefail
          python3 -B scripts/check_interop_matrix.py 2>&1 \
            | tee "$RUNNER_TEMP/interop-matrix.log"

      - name: Verify read-only repository state
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Capture policy evidence
        if: always()
        run: |
          set +e
          evidence="$RUNNER_TEMP/interop-matrix-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/interop-matrix.log" "$evidence/" 2>/dev/null
          cp docs/interop/compatibility-matrix.json "$evidence/" 2>/dev/null
          sha256sum docs/interop/compatibility-matrix.json \
            > "$evidence/compatibility-matrix.sha256" 2>/dev/null
          git status --porcelain=v1 --untracked-files=all \
            > "$evidence/repository-status.txt" 2>&1

      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interop-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interop-matrix-evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
